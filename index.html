<style>
  /* ===== Design tokens — DESIGN_apple.md ===== */
  :root {
    --primary: #0066cc;          /* Action Blue — 유일한 인터랙티브 컬러 */
    --primary-focus: #0071e3;
    --ink: #1d1d1f;
    --ink-muted-48: #7a7a7a;
    --hairline: #e0e0e0;
    --canvas: #ffffff;
    --canvas-parchment: #f5f5f7;
    --on-primary: #ffffff;
    --surface-black: #000000;

    --font-display: 'SF Pro Display', system-ui, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --font-text: 'SF Pro Text', system-ui, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;

    /* 시스템 유일의 드롭섀도 — 제품 이미지 전용 */
    --product-shadow: drop-shadow(3px 5px 30px rgba(0, 0, 0, 0.22));
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-text);
    font-size: 17px;
    line-height: 1.47;
    letter-spacing: -0.374px;
    display: flex;
    flex-direction: column;
  }

  /* ===== global-nav: 44px true-black bar ===== */
  .global-nav {
    height: 44px;
    flex: 0 0 44px;
    background: var(--surface-black);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: -0.12px;
  }

  /* ===== hero tile: white canvas, centered stack ===== */
  .hero-tile {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 80px 24px;
    background: var(--canvas);
  }

  .hero-tile.hidden { display: none; }

  .ring {
    font-size: 88px;
    line-height: 1;
    margin-bottom: 48px;
    /* 제품 렌더가 표면에 놓일 때만 허용되는 단 하나의 그림자 */
    filter: var(--product-shadow);
  }

  .tagline {
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 600;
    line-height: 1.19;
    letter-spacing: 0.231px;
    color: var(--primary);
    margin-bottom: 12px;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 56px;
    font-weight: 600;
    line-height: 1.07;
    letter-spacing: -0.28px;
    color: var(--ink);
    margin-bottom: 17px;
  }

  .lead {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 400;
    line-height: 1.14;
    letter-spacing: 0.196px;
    color: var(--ink-muted-48);
    margin-bottom: 48px;
  }

  .buttons {
    display: flex;
    gap: 17px;
    justify-content: center;
    align-items: center;
  }

  .btn {
    font-family: var(--font-text);
    font-size: 17px;
    font-weight: 400;
    line-height: 1;
    letter-spacing: -0.374px;
    border-radius: 9999px;
    padding: 14px 28px;
    cursor: pointer;
    min-height: 44px;
    min-width: 44px;
    transition: transform 0.12s ease;
    touch-action: manipulation;
  }

  /* 시스템 공통 마이크로 인터랙션 */
  .btn:active {
    transform: scale(0.95);
  }

  .btn:focus-visible {
    outline: 2px solid var(--primary-focus);
    outline-offset: 2px;
  }

  /* button-primary: Action Blue pill */
  .btn-primary {
    background: var(--primary);
    color: var(--on-primary);
    border: none;
  }

  /* button-secondary-pill: ghost pill */
  .btn-ghost {
    background: transparent;
    color: var(--primary);
    border: 1px solid var(--primary);
  }

  #noBtn { z-index: 5; }

  #noBtn.escaped {
    position: fixed;
    background: var(--canvas);
  }

  /* ===== 이름 입력 — search-input: pill, hairline, 44px ===== */
  .name-form {
    display: flex;
    flex-direction: column;
    gap: 17px;
    align-items: center;
    width: 100%;
    max-width: 320px;
  }

  .name-input {
    font-family: var(--font-text);
    font-size: 17px;
    letter-spacing: -0.374px;
    color: var(--ink);
    background: var(--canvas);
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 9999px;
    padding: 12px 20px;
    height: 44px;
    width: 100%;
    text-align: center;
  }

  .name-input::placeholder { color: var(--ink-muted-48); }

  .name-input:focus {
    outline: 2px solid var(--primary-focus);
    outline-offset: 1px;
    border-color: transparent;
  }

  .name-form .btn-primary { margin-top: 12px; }

  /* ===== footer: parchment, fine-print ===== */
  .footer {
    flex: 0 0 auto;
    background: var(--canvas-parchment);
    color: var(--ink-muted-48);
    font-size: 12px;
    font-weight: 400;
    line-height: 1.3;
    letter-spacing: -0.12px;
    text-align: center;
    padding: 24px;
  }

  /* ===== 고마워 팝업: frosted overlay + hairline card ===== */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(245, 245, 247, 0.8);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    backdrop-filter: saturate(180%) blur(20px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .overlay.show { display: flex; }

  .popup {
    background: var(--canvas);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    padding: 48px 56px;
    text-align: center;
    margin: 24px;
    animation: popIn 0.4s cubic-bezier(0.32, 0.72, 0, 1);
  }

  @keyframes popIn {
    0%   { transform: scale(0.92); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .popup .emoji {
    font-size: 64px;
    line-height: 1;
    display: block;
    margin-bottom: 24px;
    filter: var(--product-shadow);
  }

  .popup h2 {
    font-family: var(--font-display);
    font-size: 40px;
    font-weight: 600;
    line-height: 1.1;
    color: var(--ink);
    margin-bottom: 12px;
  }

  .popup p {
    font-size: 17px;
    line-height: 1.47;
    letter-spacing: -0.374px;
    color: var(--ink-muted-48);
  }

  .popup .couple {
    margin-top: 17px;
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 600;
    letter-spacing: 0.231px;
    color: var(--primary);
  }

  .popup .dday {
    margin-top: 8px;
    font-size: 17px;
    color: var(--ink-muted-48);
  }

  /* 결혼식 날짜 입력 폼 */
  .date-form {
    display: flex;
    flex-direction: column;
    gap: 17px;
    align-items: center;
    margin-top: 32px;
  }

  .date-input {
    font-family: var(--font-text);
    font-size: 17px;
    letter-spacing: -0.374px;
    color: var(--ink);
    background: var(--canvas);
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 9999px;
    padding: 12px 20px;
    height: 44px;
    width: 240px;
    text-align: center;
  }

  .date-input:focus {
    outline: 2px solid var(--primary-focus);
    outline-offset: 1px;
    border-color: transparent;
  }

  .popup .hint {
    font-size: 14px;
    letter-spacing: -0.224px;
    color: var(--ink-muted-48);
  }

  /* 고마워 + 홀 추천 팝업 스택 */
  .popup-stack {
    display: flex;
    flex-direction: column;
    gap: 17px;
    align-items: center;
    margin: 24px;
  }

  .popup-stack .popup { margin: 0; }

  /* 홀 추천 카드 — 클릭 가능한 보조 팝업 */
  .popup-hall {
    display: flex;
    align-items: center;
    gap: 17px;
    padding: 20px 28px;
    text-decoration: none;
    cursor: pointer;
    animation-delay: 0.15s;
    animation-fill-mode: backwards;
    transition: transform 0.12s ease;
  }

  .popup-hall:active { transform: scale(0.97); }

  .popup-hall .hall-emoji {
    font-size: 40px;
    line-height: 1;
  }

  .popup-hall .hall-text {
    display: flex;
    flex-direction: column;
    text-align: left;
  }

  .popup-hall .hall-text strong {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.374px;
    color: var(--ink);
  }

  .popup-hall .hall-text span {
    font-size: 17px;
    letter-spacing: -0.374px;
    color: var(--primary);
  }

  /* 좋아 클릭 시 터지는 하트 */
  .burst-heart {
    position: fixed;
    font-size: 26px;
    pointer-events: none;
    z-index: 200;
    animation: burst 1.3s ease-out forwards;
  }

  @keyframes burst {
    0%   { transform: translate(0, 0) scale(0.5); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.4); opacity: 0; }
  }

  /* ===== Responsive: hero 56 → 40 → 34 → 28 ===== */
  @media (max-width: 1068px) {
    h1 { font-size: 40px; }
    .lead { font-size: 24px; }
  }

  @media (max-width: 640px) {
    h1 { font-size: 34px; letter-spacing: -0.374px; }
    .lead { font-size: 21px; }
    .hero-tile { padding: 48px 20px; }
    .ring { font-size: 72px; margin-bottom: 32px; }
    .popup { padding: 40px 32px; }
    .popup h2 { font-size: 34px; }
  }

  @media (max-width: 419px) {
    h1 { font-size: 28px; }
    .lead { font-size: 19px; }
    .buttons { flex-direction: column; gap: 12px; }
  }
</style>

<body>

  <nav class="global-nav">A Question for You</nav>

  <!-- 1단계: 신랑/신부 이름 입력 -->
  <main class="hero-tile" id="introTile">
    <span class="ring">💍</span>
    <p class="tagline">시작하기 전에</p>
    <h1>두 사람의 이름을 알려주세요.</h1>
    <p class="lead">질문은 그다음에 시작됩니다.</p>
    <form class="name-form" id="nameForm">
      <input class="name-input" id="groomInput" type="text" placeholder="신랑 이름" maxlength="10" autocomplete="off">
      <input class="name-input" id="brideInput" type="text" placeholder="신부 이름" maxlength="10" autocomplete="off">
      <button class="btn btn-primary" type="submit">시작하기</button>
    </form>
  </main>

  <!-- 2단계: 프로포즈 -->
  <main class="hero-tile hidden" id="proposeTile">
    <span class="ring">💍</span>
    <p class="tagline" id="proposeTagline">진심을 담은 한 가지 질문</p>
    <h1 id="proposeTitle">나와 결혼해 줄래?</h1>
    <p class="lead">너와 함께하는 모든 날을 꿈꿔 왔어.</p>
    <div class="buttons">
      <button class="btn btn-primary" id="yesBtn">좋아!!</button>
      <button class="btn btn-ghost" id="noBtn">싫어!!</button>
    </div>
  </main>

  <footer class="footer">
    이 질문에는 정답이 하나뿐입니다. &nbsp;·&nbsp; Made with ❤️
  </footer>

  <!-- 결혼식 날짜 입력 팝업 -->
  <div class="overlay" id="dateOverlay">
    <div class="popup">
      <span class="emoji">📅</span>
      <h2>우리 결혼식은 언제가 좋을까?</h2>
      <p class="hint">아직 정해지지 않았다면,<br>대략적인 또는 예상되는 날짜를 적어줘도 좋아요.</p>
      <form class="date-form" id="dateForm">
        <input class="date-input" id="weddingDateInput" type="date" required>
        <button class="btn btn-primary" type="submit">이 날로 정했어!</button>
      </form>
    </div>
  </div>

  <!-- 고마워 팝업 + 홀 추천 팝업 -->
  <div class="overlay" id="overlay">
    <div class="popup-stack">
      <div class="popup">
        <span class="emoji">🥰</span>
        <h2>고마워!!</h2>
        <p>우리 행복하게 잘 살자.<br>사랑해!!</p>
        <p class="couple" id="coupleNames"></p>
        <p class="dday" id="ddayText"></p>
      </div>
      <a class="popup popup-hall" id="hallLink" href="https://www.skkconvention.co.kr/" target="_blank" rel="noopener">
        <span class="hall-emoji">💒</span>
        <span class="hall-text">
          <strong>결혼식장은 정했나요?</strong>
          <span>성균관컨벤션 보러가기 →</span>
        </span>
      </a>
    </div>
  </div>

<script>
  /* Supabase 연동은 Vercel 서버리스 함수(/api/save)가 담당.
     SUPABASE_URL / SUPABASE_ANON_KEY는 Vercel 환경변수로 관리됨.
     테이블 생성 SQL은 supabase_setup.sql 참고. */

  const introTile = document.getElementById('introTile');
  const proposeTile = document.getElementById('proposeTile');
  const nameForm = document.getElementById('nameForm');
  const groomInput = document.getElementById('groomInput');
  const brideInput = document.getElementById('brideInput');
  const proposeTagline = document.getElementById('proposeTagline');
  const proposeTitle = document.getElementById('proposeTitle');
  const coupleNames = document.getElementById('coupleNames');
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  const overlay = document.getElementById('overlay');
  const dateOverlay = document.getElementById('dateOverlay');
  const dateForm = document.getElementById('dateForm');
  const weddingDateInput = document.getElementById('weddingDateInput');
  const ddayText = document.getElementById('ddayText');

  let gameStarted = false;
  let groomName = '신랑';
  let brideName = '신부';

  // 한글 이름 호격 조사: 받침 있으면 '아', 없으면 '야'
  function vocative(name) {
    const last = name.charCodeAt(name.length - 1);
    if (last >= 0xAC00 && last <= 0xD7A3) {
      return (last - 0xAC00) % 28 !== 0 ? name + '아' : name + '야';
    }
    return name; // 한글이 아니면 이름만
  }

  // 이름 입력 → 게임 시작
  nameForm.addEventListener('submit', (e) => {
    e.preventDefault();
    groomName = groomInput.value.trim() || '신랑';
    brideName = brideInput.value.trim() || '신부';

    proposeTagline.textContent = groomName + '의 진심을 담은 한 가지 질문';
    proposeTitle.textContent = vocative(brideName) + ', 나와 결혼해 줄래?';
    coupleNames.textContent = groomName + ' ❤️ ' + brideName;

    introTile.classList.add('hidden');
    proposeTile.classList.remove('hidden');
    gameStarted = true;
  });

  const ESCAPE_DISTANCE = 160; // 마우스가 이 거리 안으로 오면 도망가기 시작 (px)
  const MAX_SPEED = 5;         // 슬금슬금 도망가는 최대 속도 (px/frame)
  const MARGIN = 20;           // 화면 가장자리 여백

  // 버튼을 화면 안의 랜덤 위치로 이동 (모바일 터치용)
  function teleport() {
    const rect = noBtn.getBoundingClientRect();
    const maxX = window.innerWidth - rect.width - MARGIN;
    const maxY = window.innerHeight - rect.height - MARGIN;

    let newX, newY;
    // 현재 위치와 충분히 떨어진 곳으로 이동 (제자리 점프 방지)
    do {
      newX = MARGIN + Math.random() * (maxX - MARGIN);
      newY = MARGIN + Math.random() * (maxY - MARGIN);
    } while (Math.hypot(newX - rect.left, newY - rect.top) < 150);

    noBtn.classList.add('escaped');
    noBtn.style.left = newX + 'px';
    noBtn.style.top = newY + 'px';
  }

  // [PC] 마우스가 가까이 오면 반대 방향으로 슬금슬금 도망
  let mouseX = -9999, mouseY = -9999;

  document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });

  function flee() {
    if (!gameStarted) { requestAnimationFrame(flee); return; }

    const rect = noBtn.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let dx = cx - mouseX;
    let dy = cy - mouseY;
    const dist = Math.hypot(dx, dy);

    if (dist < ESCAPE_DISTANCE && noBtn.style.display !== 'none') {
      // 가까울수록 빨라지고, 멀어질수록 느려짐
      const speed = MAX_SPEED * (1 - dist / ESCAPE_DISTANCE) + 1;
      dx /= dist || 1;
      dy /= dist || 1;

      const minX = MARGIN, maxX = window.innerWidth - rect.width - MARGIN;
      const minY = MARGIN, maxY = window.innerHeight - rect.height - MARGIN;
      let newX = rect.left + dx * speed;
      let newY = rect.top + dy * speed;

      // 벽에 막히면 벽을 따라 미끄러지듯 빠져나감
      if (newX < minX || newX > maxX) {
        newX = Math.min(Math.max(newX, minX), maxX);
        const slideY = (Math.abs(dy) > 0.1 ? Math.sign(dy) : (cy > window.innerHeight / 2 ? -1 : 1));
        newY = rect.top + slideY * speed * 1.5;
      }
      if (newY < minY || newY > maxY) {
        newY = Math.min(Math.max(newY, minY), maxY);
        const slideX = (Math.abs(dx) > 0.1 ? Math.sign(dx) : (cx > window.innerWidth / 2 ? -1 : 1));
        newX = rect.left + slideX * speed * 1.5;
        newX = Math.min(Math.max(newX, minX), maxX);
      }

      noBtn.classList.add('escaped');
      noBtn.style.left = newX + 'px';
      noBtn.style.top = newY + 'px';
    }
    requestAnimationFrame(flee);
  }
  requestAnimationFrame(flee);

  // [모바일] 터치하는 순간 순간이동 (클릭 자체가 불가능)
  noBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    teleport();
  }, { passive: false });

  // 혹시라도 클릭이 들어오면 (키보드 등) 도망
  noBtn.addEventListener('click', (e) => {
    e.preventDefault();
    teleport();
  });

  // 화면 크기가 바뀌면 버튼이 화면 밖에 있지 않도록 보정
  window.addEventListener('resize', () => {
    if (noBtn.classList.contains('escaped')) teleport();
  });

  // 좋아!! 클릭 → 결혼식 날짜 입력 팝업
  yesBtn.addEventListener('click', () => {
    noBtn.style.display = 'none';
    dateOverlay.classList.add('show');
  });

  // 날짜를 YYYY-MM-DD 로 (로컬 기준)
  function toDateString(d) {
    const pad = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  // 날짜 제출 → DB 저장 → 하트 폭죽 + 고마워 팝업
  dateForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const weddingDate = weddingDateInput.value;          // YYYY-MM-DD
    const usedAt = toDateString(new Date());             // 서비스를 사용한 날짜
    const daysDiff = Math.round(
      (new Date(weddingDate) - new Date(usedAt)) / (1000 * 60 * 60 * 24)
    );

    // D-Day 문구
    if (daysDiff > 0) {
      ddayText.textContent = '결혼식까지 ' + daysDiff + '일 남았어요! (D-' + daysDiff + ')';
    } else if (daysDiff === 0) {
      ddayText.textContent = '바로 오늘이 결혼식이에요!';
    } else {
      ddayText.textContent = '결혼식으로부터 ' + Math.abs(daysDiff) + '일이 지났어요.';
    }

    // Vercel 서버리스 함수를 통해 저장 (실패해도 프로포즈 흐름은 계속)
    try {
      const resp = await fetch('/api/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          groom_name: groomName,
          bride_name: brideName,
          wedding_date: weddingDate,
          used_at: usedAt,
          days_diff: daysDiff
        })
      });
      if (!resp.ok) console.error('저장 실패:', await resp.text());
    } catch (err) {
      console.error('저장 실패:', err);
    }

    dateOverlay.classList.remove('show');
    burstHearts();
    setTimeout(() => overlay.classList.add('show'), 350);
  });

  // 홀 추천 팝업 클릭 → GA 이벤트 측정
  document.getElementById('hallLink').addEventListener('click', () => {
    if (typeof gtag === 'function') {
      gtag('event', 'hall_recommend_click', {
        hall_name: 'skkconvention',
        link_url: 'https://www.skkconvention.co.kr/'
      });
    }
  });

  function burstHearts() {
    const emojis = ['💖', '💕', '❤️', '✨'];
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    for (let i = 0; i < 24; i++) {
      const h = document.createElement('span');
      h.className = 'burst-heart';
      h.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      h.style.left = cx + 'px';
      h.style.top = cy + 'px';
      const angle = Math.random() * Math.PI * 2;
      const dist = 120 + Math.random() * 220;
      h.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      h.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 1300);
    }
  }
</script>
</body>
</html>
